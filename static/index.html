<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VizMedCare HMS</title>
<link rel="stylesheet" href="/static/style.css?v=8">
</head>
<body>
<div id="login" class="portal hidden">
  <div class="portal-wrap">
    <div class="portal-top"><div class="brand"><div class="logo" style="margin:0">✚</div> VizMedCare</div><span class="pill">Staff portal</span></div>
    <h1>Choose your desk</h1>
    <p class="muted">Pick a role to sign in. Demo passwords are filled for you.</p>
    <div class="portal-grid" id="portalGrid"></div>
    <form id="loginForm" class="login-card" style="margin:22px auto 0;text-align:left">
      <h3 id="deskTitle" style="margin:0 0 8px">Sign in</h3>
      <label>Username<input name="username" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <div id="loginErr" class="err"></div>
      <button class="btn primary block">Sign in</button>
    </form>
  </div>
</div>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <button id="menuBtn" class="btn ghost menu">☰</button>
      <h2 id="pageTitle"></h2>
      <div class="spacer"></div>
      <button id="topSetupBtn" class="btn primary sm" onclick="go('settings')" title="Configure Hospital Name, Doctors & Master Data">⚙️ Hospital Setup</button>
      <select id="themeSelect" class="theme-pick" title="Switch Application Theme">
        <option value="indigo">🎨 Royal Indigo (Default)</option>
        <option value="emerald">🌿 Emerald Forest</option>
        <option value="crimson">🌹 Crimson Rose</option>
        <option value="sapphire">💎 Ocean Sapphire</option>
        <option value="midnight">🌙 Dark Midnight</option>
        <option value="aurora">✨ Aurora Violet</option>
        <option value="obsidian">🖤 Obsidian Cyan</option>
        <option value="coral">🧡 Warm Coral</option>
        <option value="teal">🩵 Soft Teal</option>
        <option value="hospital">🏥 Clinical Blue</option>
      </select>
      <span id="clock" class="muted"></span>
      <div class="user"><div id="avatar" class="avatar"></div><div><b id="uName"></b><div id="uRole" class="muted small"></div></div></div>
      <button id="logout" class="btn ghost">Sign out</button>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h3 id="mTitle"></h3><button class="btn ghost" id="mClose">✕</button></div><div id="mBody" class="modal-body"></div></div></div>
<div id="toast" class="toast"></div>
<script src="/static/app.js?v=22"></script>
</body>
</html>
